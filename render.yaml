# SAURON VISION — Render.com Blueprint (Pro Plus — 4 CPU)
databases:
  - name: sauron-db
    plan: pro-8gb
    databaseName: sauron_vision
    user: sauron

services:
  # Django Web
  - type: web
    name: sauron-web
    runtime: python
    plan: pro_plus
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 8 --timeout 120"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: sauron-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: sauron-redis
          type: keyvalue
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.3"
      - fromGroup: sauron-env

  # Celery Fast Worker (prices, news, signals)
  - type: worker
    name: sauron-worker-fast
    runtime: python
    plan: pro_plus
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A config worker -l info -Q fast,default -c 8 --max-tasks-per-child=100"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sauron-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: sauron-redis
          type: keyvalue
          property: connectionString
      - fromGroup: sauron-env

  # Celery Slow Worker (AI agents)
  - type: worker
    name: sauron-worker-slow
    runtime: python
    plan: pro_plus
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A config worker -l info -Q slow,ai -c 4 --max-tasks-per-child=50"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sauron-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: sauron-redis
          type: keyvalue
          property: connectionString
      - fromGroup: sauron-env

  # Celery Beat Scheduler
  - type: worker
    name: sauron-beat
    runtime: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sauron-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: sauron-redis
          type: keyvalue
          property: connectionString
      - fromGroup: sauron-env

  # Redis (Key Value Store)
  - type: keyvalue
    name: sauron-redis
    plan: pro
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
