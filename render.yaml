# SAURON VISION — Render.com Blueprint (Pro)
databases:
  - name: sauron-db
    plan: pro-4gb
    databaseName: sauron_vision
    user: sauron

services:
  # Django Web (ASGI via Daphne)
  - type: web
    name: sauron-web
    runtime: python
    plan: pro
    buildCommand: "./build.sh"
    startCommand: "daphne -b 0.0.0.0 -p $PORT config.asgi:application"
    healthCheckPath: "/login/"
    envVars:
      - key: SECRET_KEY
        sync: false                    # set manually in dashboard, never regenerate
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: sauron-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: sauron-redis
          type: keyvalue
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: WEB_CONCURRENCY
        value: "2"
      - fromGroup: sauron-env

  # Celery Fast Worker
  - type: worker
    name: sauron-worker-fast
    runtime: python
    plan: pro
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A config worker -l info -Q fast,default -c 4 --max-tasks-per-child=100"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sauron-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: sauron-redis
          type: keyvalue
          property: connectionString
      - fromGroup: sauron-env

  # Celery Slow Worker (AI agents)
  - type: worker
    name: sauron-worker-slow
    runtime: python
    plan: pro
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A config worker -l info -Q slow,ai -c 2 --max-tasks-per-child=50"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sauron-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: sauron-redis
          type: keyvalue
          property: connectionString
      - fromGroup: sauron-env

  # Celery Beat Scheduler
  - type: worker
    name: sauron-beat
    runtime: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sauron-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: sauron-redis
          type: keyvalue
          property: connectionString
      - fromGroup: sauron-env

  # Redis
  - type: keyvalue
    name: sauron-redis
    plan: pro
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
