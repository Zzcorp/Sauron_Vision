# Sauron Vision — the single production stack.
#
# One box runs everything: Postgres, Redis, the ASGI web service, the two
# Celery workers, beat, Caddy for TLS, and (optionally) the market-data
# streamers. This replaces the four rival deployment definitions that used
# to disagree with each other about database names, queue flags and env
# files — following any one of them led into a wall part-way through.
#
#   cp .env.production.example .env      # then fill it in
#   docker compose --env-file .env -f deploy/docker-compose.yml up -d --build
#
# --env-file is NOT optional and is needed on EVERY subcommand (ps, logs,
# exec, down). Compose interpolates ${VAR} from the project directory, which
# with `-f deploy/...` is deploy/ - not the repo root where .env lives. Without
# it the very first command aborts with "DB_PASSWORD must be set in .env"
# while DB_PASSWORD is plainly set in .env.
#
# Streamers are opt-in so a first deploy has fewer moving parts:
#   docker compose --env-file .env -f deploy/docker-compose.yml --profile streamers up -d
#
# See deploy/RUNBOOK.md for the full first-deploy walkthrough.

name: sauron

x-django: &django
  build:
    context: ..
    dockerfile: Dockerfile.prod
  env_file: ../.env
  environment:
    # Every service MUST share one Redis: the streamers publish into a
    # pub/sub channel that the web process subscribes to for browser
    # WebSockets. Different Redis instances = updates silently never arrive.
    REDIS_URL: redis://redis:6379/0
    DB_ENGINE: postgresql
    DB_HOST: postgres
    DB_PORT: "5432"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set in .env}
      POSTGRES_USER: ${DB_USER:?DB_USER must be set in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:?} -d ${DB_NAME:?}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Migrations run ONCE here rather than racing in every service's entrypoint.
  # django_celery_beat's tables must exist before beat starts, which is why
  # everything below waits for this to complete successfully.
  migrate:
    build:
      context: ..
      dockerfile: Dockerfile.prod
    env_file: ../.env
    environment:
      REDIS_URL: redis://redis:6379/0
      DB_ENGINE: postgresql
      DB_HOST: postgres
      DB_PORT: "5432"
    # No collectstatic here: it is baked into the image at build time
    # (Dockerfile.prod). Running it in this one-shot container wrote the
    # assets into a filesystem that is then discarded, leaving `web` with an
    # empty /app/staticfiles and the whole site unstyled.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_instruments &&
             python manage.py seed_components"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  web:
    <<: *django
    command: >
      daphne -b 0.0.0.0 -p 8000 config.asgi:application
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz/')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Queue coverage matters: config/celery.py routes some tasks to fast/slow/ai
  # and sends everything else to `default`. Between these two workers every
  # queue in the beat schedule is consumed — a worker set that misses one
  # silently drops half the schedule.
  worker-fast:
    <<: *django
    command: celery -A config worker -l info -Q fast,default -c 2 --without-gossip --without-mingle
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s

  worker-slow:
    <<: *django
    command: celery -A config worker -l info -Q slow,ai -c 2 --without-gossip --without-mingle

  beat:
    <<: *django
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - web
    restart: unless-stopped

  # ── Market-data streamers (opt-in: --profile streamers) ────────────────
  # Binance public streams need no API key. Finnhub/OANDA need credentials
  # in .env; without them the command exits and the container stays down,
  # which is the honest outcome.
  stream-binance:
    <<: *django
    command: python manage.py stream_binance
    profiles: ["streamers"]

  stream-binance-futures:
    <<: *django
    command: python manage.py stream_binance_futures
    profiles: ["streamers"]

  stream-binance-depth:
    <<: *django
    command: python manage.py stream_binance_depth
    profiles: ["streamers"]

  stream-oanda:
    <<: *django
    command: python manage.py stream_oanda
    profiles: ["streamers"]

  stream-finnhub:
    <<: *django
    command: python manage.py stream_finnhub
    profiles: ["streamers"]

  # ── Nightly offsite backup (opt-in: --profile backup) ──────────────────
  # A dump that lives on the same disk as the database is not a backup.
  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    env_file: ../.env
    environment:
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      RCLONE_CONFIG: /config/rclone.conf
    volumes:
      - ./backup.sh:/backup.sh:ro
      - backups:/backups
      # Mounted as a FILE, never a directory: if a directory source is absent
      # Docker helpfully creates an empty root-owned one and the container
      # starts with no rclone config at all. A missing file makes it refuse
      # to start, which is the honest outcome.
      - ${RCLONE_CONF:-/home/sauron/.config/rclone/rclone.conf}:/config/rclone.conf:ro
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    # Not behind a profile. "Optional extras" is the wrong category for the
    # only thing standing between a disk failure and losing every trade,
    # position and credential the platform has recorded.
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
  backups:
