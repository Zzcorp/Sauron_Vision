{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sauron Vision — PIN</title>
    <link rel="icon" href="{% static 'logo/favicon.ico' %}" sizes="any">
    <link rel="icon" type="image/svg+xml" href="{% static 'logo/sauron_eye.svg' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'logo/favicon-32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'logo/favicon-16.png' %}">
    <link rel="apple-touch-icon" href="{% static 'logo/apple-touch-icon.png' %}">
    <meta name="theme-color" content="#030806">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030806; --bg2: #060e0a; --accent: #00e868;
            --accent-dim: #0a5028; --accent-bright: #40ff90;
            --text: #c8e8d8; --text2: #7aaa8a; --text3: #3a6850; --border: #133020;
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}

        /* ── Background layers ── */
        .grid-bg{position:fixed;inset:-50%;background-image:linear-gradient(rgba(0,232,104,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,232,104,0.03) 1px,transparent 1px);background-size:80px 80px;animation:gridDrift 40s linear infinite;z-index:0;pointer-events:none}
        @keyframes gridDrift{0%{transform:translate(0,0)}100%{transform:translate(80px,80px)}}
        .eye-glow-shadow{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:70vmin;height:70vmin;z-index:0;pointer-events:none;background:radial-gradient(circle,rgba(0,232,104,0.10) 0%,rgba(0,232,104,0.03) 30%,transparent 55%);filter:blur(50px)}
        .globe-eye{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:90vmin;height:90vmin;z-index:0;pointer-events:none;opacity:0.085}
        .globe-eye .globe-spin{transform-origin:400px 400px;animation:globeSpin 80s linear infinite}
        @keyframes globeSpin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
        #bgCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
        .scan-line{position:fixed;top:0;left:0;bottom:0;width:3px;z-index:1;animation:scanRTL 8s linear infinite;pointer-events:none}
        .scan-line::before{content:'';position:absolute;top:0;left:-40px;bottom:0;width:80px;background:linear-gradient(90deg,transparent,rgba(0,232,104,0.06),transparent)}
        .scan-line::after{content:'';position:absolute;top:0;left:0;bottom:0;width:3px;background:linear-gradient(180deg,transparent 10%,rgba(0,232,104,0.4) 50%,transparent 90%);box-shadow:0 0 15px rgba(0,232,104,0.3)}
        @keyframes scanRTL{0%{left:100%}100%{left:-80px}}

        /* ── PIN container ── */
        .pin-container{position:relative;z-index:10;width:380px;max-width:90vw}

        /* ── Staggered fade-in ── */
        .fade-up{opacity:0;transform:translateY(30px);animation:fadeUp 0.7s cubic-bezier(0.16,1,0.3,1) forwards}
        .fade-up.d1{animation-delay:0.1s} .fade-up.d2{animation-delay:0.25s}
        .fade-up.d3{animation-delay:0.4s} .fade-up.d4{animation-delay:0.55s}
        .fade-up.d5{animation-delay:0.7s}
        @keyframes fadeUp{to{opacity:1;transform:translateY(0)}}

        /* ── Logo with glow (compact) ── */
        .logo-wrap{position:relative;width:90px;height:90px;margin:0 auto 14px}
        .logo-glow{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(0,232,104,0.18) 0%,rgba(0,232,104,0.05) 40%,transparent 70%);animation:logoGlow 4s ease-in-out infinite;pointer-events:none}
        @keyframes logoGlow{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:0.7}50%{transform:translate(-50%,-50%) scale(1.15);opacity:1}}
        .logo-img{position:relative;z-index:1;width:90px;height:90px;display:block;object-fit:contain;filter:drop-shadow(0 0 25px rgba(0,232,104,0.25));animation:logoFloat 6s ease-in-out infinite}
        @keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

        .pin-title{font-family:'Orbitron',sans-serif;font-size:18px;font-weight:900;letter-spacing:5px;color:var(--accent);text-align:center;margin-bottom:2px;text-shadow:0 0 30px rgba(0,232,104,0.2)}
        .pin-subtitle{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:3px;color:var(--text3);text-align:center;margin-bottom:12px}
        .pin-who{text-align:center;font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--text2);margin-bottom:12px;opacity:0.8}

        /* ── Card ── */
        .pin-card{background:rgba(10,26,20,0.92);border:1px solid var(--border);border-radius:12px;padding:22px 24px;backdrop-filter:blur(24px);box-shadow:0 4px 60px rgba(0,0,0,0.6),0 0 80px rgba(0,232,104,0.04)}
        .pin-row{display:flex;gap:10px;justify-content:center;margin-bottom:16px}
        .pin-row input{width:44px;height:52px;text-align:center;font-family:'Orbitron',sans-serif;font-size:20px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--accent);outline:none;transition:border-color .2s,box-shadow .2s,transform .15s}
        .pin-row input:focus{border-color:var(--accent);box-shadow:0 0 20px rgba(0,232,104,0.2);transform:scale(1.05)}
        .btn-verify{width:100%;padding:12px;background:linear-gradient(135deg,var(--accent-dim),var(--accent));border:none;border-radius:6px;color:#020804;font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;letter-spacing:4px;cursor:pointer;text-transform:uppercase;transition:transform .3s,box-shadow .3s,background .3s}
        .btn-verify:hover{transform:translateY(-2px);box-shadow:0 0 24px rgba(0,232,104,0.4),0 0 48px rgba(0,232,104,0.15),0 8px 30px rgba(0,232,104,0.25);background:linear-gradient(135deg,var(--accent),var(--accent-bright))}
        .pin-err{background:rgba(232,48,48,0.08);border:1px solid rgba(232,48,48,0.25);border-radius:6px;padding:10px;margin-bottom:14px;font-family:'Share Tech Mono',monospace;font-size:11px;color:#e83030;text-align:center}

        /* ── Keypad ── */
        .sauron-keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px}
        .sauron-keypad button{padding:11px 0;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Orbitron',sans-serif;font-size:16px;font-weight:700;cursor:pointer;transition:all .15s}
        .sauron-keypad button:hover{border-color:var(--accent);color:var(--accent);box-shadow:0 0 14px rgba(0,232,104,0.18)}
        .sauron-keypad button:active{transform:scale(0.95);background:var(--bg2)}
        .sauron-keypad button.kp-fn{color:var(--text3);font-size:14px}
        .sauron-keypad button.kp-fn:hover{color:#e83030;border-color:#581818}

        .pin-back{display:block;text-align:center;margin-top:14px;font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:2px;color:var(--text3);text-decoration:none;text-transform:uppercase;transition:color .3s}
        .pin-back:hover{color:var(--accent)}

        /* ── Forgot-PIN escape hatch ── */
        .pin-forgot{display:block;text-align:center;margin-top:12px;font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:2px;color:var(--text3);text-decoration:none;text-transform:uppercase;transition:color .3s}
        .pin-forgot:hover{color:var(--accent)}
        .forgot-label{display:block;font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:3px;color:var(--text3);text-transform:uppercase;margin-bottom:8px}
        .forgot-input{width:100%;padding:12px 16px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'Share Tech Mono',monospace;font-size:14px;outline:none;margin-bottom:14px;transition:border-color .2s,box-shadow .2s}
        .forgot-input:focus{border-color:var(--accent);box-shadow:0 0 15px rgba(0,232,104,0.1)}
    </style>
</head>
<body>
    <div class="grid-bg"></div>
    <div class="eye-glow-shadow"></div>

    <svg class="globe-eye" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <filter id="pinEyeGlow" x="-100%" y="-100%" width="300%" height="300%">
                <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur1"/>
                <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur2"/>
                <feMerge><feMergeNode in="blur1"/><feMergeNode in="blur2"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
            <radialGradient id="pinPupilFill" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#00e868" stop-opacity="0.4"/>
                <stop offset="60%" stop-color="#00e868" stop-opacity="0.15"/>
                <stop offset="100%" stop-color="#00e868" stop-opacity="0"/>
            </radialGradient>
        </defs>
        <g class="eye-static">
            <ellipse cx="400" cy="400" rx="390" ry="240" fill="none" stroke="#00e868" stroke-width="3.5"/>
            <ellipse cx="400" cy="400" rx="360" ry="210" fill="none" stroke="#00e868" stroke-width="1.2" opacity="0.5"/>
            <circle cx="400" cy="400" r="160" fill="none" stroke="#00e868" stroke-width="2.5"/>
            <circle cx="400" cy="400" r="60" fill="none" stroke="#00e868" stroke-width="3"/>
            <circle cx="400" cy="400" r="40" fill="url(#pinPupilFill)" filter="url(#pinEyeGlow)"/>
            <circle cx="400" cy="400" r="20" fill="#00e868" opacity="0.18" filter="url(#pinEyeGlow)"/>
            <circle cx="400" cy="400" r="8" fill="#00e868" opacity="0.4"/>
            <path d="M 10,400 Q 200,100 400,160 Q 600,100 790,400" fill="none" stroke="#00e868" stroke-width="2" opacity="0.6"/>
            <path d="M 10,400 Q 200,700 400,640 Q 600,700 790,400" fill="none" stroke="#00e868" stroke-width="2" opacity="0.6"/>
        </g>
        <g class="globe-spin">
            <ellipse cx="400" cy="400" rx="50" ry="140" fill="none" stroke="#00e868" stroke-width="0.5" opacity="0.35"/>
            <ellipse cx="400" cy="400" rx="100" ry="140" fill="none" stroke="#00e868" stroke-width="0.4" opacity="0.25"/>
            <ellipse cx="400" cy="400" rx="140" ry="50" fill="none" stroke="#00e868" stroke-width="0.4" opacity="0.25"/>
            <line x1="260" y1="340" x2="540" y2="340" stroke="#00e868" stroke-width="0.4" opacity="0.2"/>
            <line x1="260" y1="400" x2="540" y2="400" stroke="#00e868" stroke-width="0.5" opacity="0.3"/>
            <line x1="260" y1="460" x2="540" y2="460" stroke="#00e868" stroke-width="0.4" opacity="0.2"/>
            <ellipse cx="400" cy="400" rx="30" ry="140" fill="none" stroke="#00e868" stroke-width="0.4" opacity="0.2" transform="rotate(25 400 400)"/>
            <ellipse cx="400" cy="400" rx="120" ry="140" fill="none" stroke="#00e868" stroke-width="0.3" opacity="0.15" transform="rotate(-20 400 400)"/>
        </g>
    </svg>

    <canvas id="bgCanvas"></canvas>
    <div class="scan-line"></div>

    <div class="pin-container">
        <div class="logo-wrap fade-up d1">
            <div class="logo-glow"></div>
            <img class="logo-img" src="{% static 'logo/logo_SV.png' %}" alt="Sauron Vision">
        </div>
        <h1 class="pin-title fade-up d2">SECOND GATE</h1>
        <p class="pin-subtitle fade-up d2">ENTER PIN CODE</p>
        <div class="pin-who fade-up d3">OPERATOR :: {{ username }}</div>
        <div class="pin-card fade-up d3">
            <div class="pin-err" id="pinErrors"{% if not error %} style="display:none"{% endif %}>{{ error }}</div>
            <form method="post" id="pinForm">{% csrf_token %}
                <div class="pin-row">
                    <input type="password" inputmode="numeric" maxlength="1" autocomplete="one-time-code" data-pin>
                    <input type="password" inputmode="numeric" maxlength="1" autocomplete="one-time-code" data-pin>
                    <input type="password" inputmode="numeric" maxlength="1" autocomplete="one-time-code" data-pin>
                    <input type="password" inputmode="numeric" maxlength="1" autocomplete="one-time-code" data-pin>
                </div>
                <input type="hidden" name="pin" id="pinFinal">
                <button type="submit" class="btn-verify">Verify</button>
            </form>
            <div class="sauron-keypad fade-up d4">
                <button type="button" data-k="1">1</button>
                <button type="button" data-k="2">2</button>
                <button type="button" data-k="3">3</button>
                <button type="button" data-k="4">4</button>
                <button type="button" data-k="5">5</button>
                <button type="button" data-k="6">6</button>
                <button type="button" data-k="7">7</button>
                <button type="button" data-k="8">8</button>
                <button type="button" data-k="9">9</button>
                <button type="button" data-k="clear" class="kp-fn">&times;</button>
                <button type="button" data-k="0">0</button>
                <button type="button" data-k="back" class="kp-fn">&#9003;</button>
            </div>
            <a href="#" class="pin-forgot" id="pinForgotLink">PIN forgotten?</a>
            <div id="pinForgotPanel" style="display:none;">
                <form method="post" action="{% url 'login_pin_forgot' %}" id="pinForgotForm">{% csrf_token %}
                    <label class="forgot-label" for="id_forgot_password">Re-enter Access Key</label>
                    <input class="forgot-input" type="password" name="password" id="id_forgot_password" autocomplete="current-password">
                    <button type="submit" class="btn-verify">Verify &amp; Reset PIN</button>
                </form>
                <a href="#" class="pin-forgot" id="pinForgotCancel">&larr; Back to PIN</a>
            </div>
        </div>
        <a class="pin-back fade-up d5" href="{% url 'login' %}">&larr; Back</a>
    </div>

    <script>
    (function(){
        /* ── Particles ── */
        var canvas = document.getElementById('bgCanvas');
        var ctx = canvas.getContext('2d');
        var W, H;
        function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
        resize(); window.addEventListener('resize', resize);

        var symbols = ['BTC','ETH','SOL','SPX','NDX','DXY','GLD','OIL','VIX','EUR','JPY','TSLA','NVDA','AAPL'];
        var prices = {};
        symbols.forEach(function(s){ prices[s] = (Math.random()*1000+50).toFixed(2); });
        setInterval(function(){
            symbols.forEach(function(s){
                var v = parseFloat(prices[s]);
                v += (Math.random()-0.5) * v * 0.002;
                prices[s] = v.toFixed(2);
            });
        }, 1500);

        var particles = [];
        for (var i = 0; i < 60; i++) {
            particles.push({
                x: Math.random()*2000, y: Math.random()*2000,
                vx: (Math.random()-0.5)*0.35, vy: (Math.random()-0.5)*0.35,
                s: Math.random()*1.6+0.3, a: Math.random()*0.22+0.05,
                sym: i < symbols.length ? symbols[i] : null,
                trail: [], trailMax: 7
            });
        }
        function draw(){
            ctx.clearRect(0,0,W,H);
            for(var i=0;i<particles.length;i++){
                for(var j=i+1;j<particles.length;j++){
                    var dx=particles[i].x-particles[j].x,dy=particles[i].y-particles[j].y;
                    var d=Math.sqrt(dx*dx+dy*dy);
                    if(d<120){ctx.beginPath();ctx.moveTo(particles[i].x,particles[i].y);ctx.lineTo(particles[j].x,particles[j].y);ctx.strokeStyle='rgba(0,232,104,'+(0.04*(1-d/120))+')';ctx.stroke();}
                }
            }
            for(var k=0;k<particles.length;k++){
                var p=particles[k];
                p.trail.push({x:p.x,y:p.y});
                if(p.trail.length > p.trailMax) p.trail.shift();
                p.x+=p.vx; p.y+=p.vy;
                var bounced=false;
                if(p.x<0||p.x>W){p.vx*=-1; bounced=true;}
                if(p.y<0||p.y>H){p.vy*=-1; bounced=true;}
                if(bounced) p.trail.length = 0;
                /* draw trail (fading) */
                for(var t=0;t<p.trail.length;t++){
                    var tp = p.trail[t];
                    var frac = t / p.trail.length;
                    ctx.beginPath();
                    ctx.arc(tp.x, tp.y, p.s * frac * 0.85, 0, Math.PI*2);
                    ctx.fillStyle = 'rgba(0,232,104,' + (p.a * frac * 0.55) + ')';
                    ctx.fill();
                }
                /* particle head */
                ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,Math.PI*2);
                ctx.fillStyle='rgba(0,232,104,'+p.a+')';ctx.fill();
                /* ticker label */
                if(p.sym && prices[p.sym]){
                    ctx.font = '9px "Share Tech Mono", monospace';
                    ctx.fillStyle = 'rgba(0,232,104,' + (p.a * 1.6) + ')';
                    ctx.fillText(p.sym + ' ' + prices[p.sym], p.x + 6, p.y - 4);
                }
            }
            requestAnimationFrame(draw);
        }
        draw();

        /* Mouse parallax on eye + glow shadow — smoothed (lerped) so the
           background visibly tracks the cursor instead of jittering */
        var globe = document.querySelector('.globe-eye');
        var eyeShadow = document.querySelector('.eye-glow-shadow');
        var pTX = 0, pTY = 0, pCX = 0, pCY = 0;
        document.addEventListener('mousemove', function(e){
            var w = window.innerWidth || W || 1;
            var h = window.innerHeight || H || 1;
            pTX = (e.clientX/w - 0.5)*2;
            pTY = (e.clientY/h - 0.5)*2;
        });
        (function eyeLoop(){
            pCX += (pTX - pCX) * 0.08;
            pCY += (pTY - pCY) * 0.08;
            if(globe) globe.style.transform = 'translate(calc(-50% + '+(pCX*60)+'px), calc(-50% + '+(pCY*60)+'px))';
            if(eyeShadow) eyeShadow.style.transform = 'translate(calc(-50% + '+(pCX*110)+'px), calc(-50% + '+(pCY*110)+'px))';
            requestAnimationFrame(eyeLoop);
        })();

        /* ── PIN logic — dynamic 4-8 boxes, document key router ──
           4 boxes render statically (they carry the fade-up entrance) and up
           to 4 more are appended as digits 5-8 arrive. Deliberately
           no auto-submit when the 4th box fills — a 6-digit operator must
           be able to keep typing; Enter or Verify is the explicit submit. */
        var pinForm = document.getElementById('pinForm');
        var pinRow = pinForm.querySelector('.pin-row');
        var pinFinal = document.getElementById('pinFinal');
        var PIN_MIN = 4, PIN_MAX = 8;

        function pinBoxes(){ return [].slice.call(pinForm.querySelectorAll('[data-pin]')); }
        function pinValue(){ return pinBoxes().map(function(x){return x.value}).join(''); }
        function updatePinFinal(){ pinFinal.value = pinValue(); }
        function makePinBox(){
            /* Same attributes as the static boxes, but no fade-up class —
               appended boxes must not replay the entrance animation. */
            var inp = document.createElement('input');
            inp.type = 'password';
            inp.maxLength = 1;
            inp.setAttribute('inputmode', 'numeric');
            inp.setAttribute('autocomplete', 'one-time-code');
            inp.setAttribute('data-pin', '');
            return inp;
        }
        function focusPinBox(el){ if(el) el.focus({preventScroll:true}); }
        function focusFirstEmptyPinBox(){
            var boxes = pinBoxes();
            for(var i=0;i<boxes.length;i++){ if(!boxes[i].value){ focusPinBox(boxes[i]); return; } }
            focusPinBox(boxes[boxes.length-1]);
        }
        function pinInsert(d){
            var boxes = pinBoxes();
            for(var i=0;i<boxes.length;i++){
                if(!boxes[i].value){ boxes[i].value = d; updatePinFinal(); focusFirstEmptyPinBox(); return; }
            }
            if(boxes.length < PIN_MAX){
                var nb = makePinBox();
                pinRow.appendChild(nb);
                nb.value = d;
                updatePinFinal();
                focusPinBox(nb);
            }
        }
        function pinBackspace(){
            var boxes = pinBoxes();
            for(var i=boxes.length-1;i>=0;i--){
                if(boxes[i].value){
                    boxes[i].value = '';
                    if(i >= PIN_MIN) boxes[i].remove();
                    updatePinFinal();
                    focusFirstEmptyPinBox();
                    return;
                }
            }
            focusFirstEmptyPinBox();
        }
        function pinClear(){
            pinBoxes().forEach(function(b, i){ if(i >= PIN_MIN){ b.remove(); } else { b.value = ''; } });
            updatePinFinal();
            focusFirstEmptyPinBox();
        }
        function submitPin(){
            updatePinFinal();
            if(pinForm.requestSubmit){ pinForm.requestSubmit(); } else { pinForm.submit(); }
        }

        focusFirstEmptyPinBox();
        pinForm.addEventListener('submit', updatePinFinal);

        /* Mobile/paste fallback: IME keyboards may bypass the key router. */
        pinForm.addEventListener('input', function(e){
            var t = e.target;
            if(!t.hasAttribute || !t.hasAttribute('data-pin')) return;
            if(t.value) t.value = t.value.replace(/\D/g,'').slice(-1);
            updatePinFinal();
            if(t.value) focusFirstEmptyPinBox();
        });

        /* Document key router — single writer for physical keys, so the PIN
           lands in the boxes no matter where focus sits. Idle while the
           forgot-PIN panel is open (the operator is typing a password). */
        function pinForgotOpen(){
            var panel = document.getElementById('pinForgotPanel');
            return !!(panel && panel.style.display !== 'none');
        }
        document.addEventListener('keydown', function(e){
            if(e.ctrlKey || e.metaKey || e.altKey) return;
            if(pinForgotOpen()) return;
            /* Links and buttons outside the pad activate with Enter and
               nothing else — swallowing it strands a keyboard-only operator
               with "PIN forgotten?" and "Back" unreachable. */
            var t = e.target;
            if(t && t.closest && t.closest('a, button') && !pinForm.contains(t)) return;
            if(/^[0-9]$/.test(e.key)){
                e.preventDefault();
                pinInsert(e.key);
            } else if(e.key === 'Backspace'){
                e.preventDefault();
                pinBackspace();
            } else if(e.key === 'Enter'){
                e.preventDefault();
                if(pinValue().length >= PIN_MIN){
                    submitPin();
                } else {
                    var pe = document.getElementById('pinErrors');
                    if(pe){ pe.textContent = 'Enter at least 4 digits'; pe.style.display = ''; }
                }
            }
        });

        /* A password manager or OS one-time-code fill drops the whole PIN in
           one box, where maxlength=1 keeps a single digit. Spread it. */
        if(pinRow){
            pinRow.addEventListener('paste', function(e){
                var src = e.clipboardData || window.clipboardData;
                var digits = ((src && src.getData('text')) || '').replace(/\D/g,'');
                if(!digits) return;
                e.preventDefault();
                pinClear();
                digits.slice(0, PIN_MAX).split('').forEach(pinInsert);
            });
        }

        /* ── Keypad ── */
        document.querySelectorAll('.sauron-keypad button').forEach(function(btn){
            btn.addEventListener('click', function(){
                var k = btn.dataset.k;
                if(k==='clear'){ pinClear(); }
                else if(k==='back'){ pinBackspace(); }
                else { pinInsert(k); }
            });
        });

        /* ── Forgot-PIN: swap the pad for a password re-entry field ── */
        var forgotLink = document.getElementById('pinForgotLink');
        var forgotPanel = document.getElementById('pinForgotPanel');
        var forgotCancel = document.getElementById('pinForgotCancel');
        var keypadEl = document.querySelector('.sauron-keypad');
        if(forgotLink){
            forgotLink.addEventListener('click', function(e){
                e.preventDefault();
                pinForm.style.display = 'none';
                if(keypadEl) keypadEl.style.display = 'none';
                forgotLink.style.display = 'none';
                forgotPanel.style.display = '';
                var pw = document.getElementById('id_forgot_password');
                if(pw){ pw.value=''; pw.focus({preventScroll:true}); }
            });
        }
        if(forgotCancel){
            forgotCancel.addEventListener('click', function(e){
                e.preventDefault();
                forgotPanel.style.display = 'none';
                pinForm.style.display = '';
                if(keypadEl) keypadEl.style.display = '';
                forgotLink.style.display = '';
                focusFirstEmptyPinBox();
            });
        }
    })();
    </script>
</body>
</html>
