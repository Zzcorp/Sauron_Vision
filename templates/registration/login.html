{% load static %}
{% load sauron_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sauron Vision — Access</title>
    <link rel="icon" href="{% static 'logo/favicon.ico' %}" sizes="any">
    <link rel="icon" type="image/svg+xml" href="{% static 'logo/sauron_eye.svg' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'logo/favicon-32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'logo/favicon-16.png' %}">
    <link rel="apple-touch-icon" href="{% static 'logo/apple-touch-icon.png' %}">
    <meta property="og:title" content="Sauron Vision — Trading Intelligence">
    {# Absolute — a relative og:image is dropped by every scraper. #}
    <meta property="og:image" content="{% static_abs 'logo/og-card.png' %}">
    <meta name="theme-color" content="#030806">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030806; --bg2: #060e0a; --accent: #00e868;
            --accent-dim: #0a5028; --accent-bright: #40ff90;
            --text: #c8e8d8; --text3: #3a6850; --border: #133020;
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}

        /* ── Background layers ── */
        .grid-bg{position:fixed;inset:-50%;background-image:linear-gradient(rgba(0,232,104,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,232,104,0.03) 1px,transparent 1px);background-size:80px 80px;animation:gridDrift 40s linear infinite;z-index:0;pointer-events:none}
        @keyframes gridDrift{0%{transform:translate(0,0)}100%{transform:translate(80px,80px)}}
        .globe-eye{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:90vmin;height:90vmin;z-index:0;pointer-events:none;opacity:0.085}
        .globe-eye .globe-spin{transform-origin:400px 400px;animation:globeSpin 80s linear infinite}
        @keyframes globeSpin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
        .eye-glow-shadow{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:70vmin;height:70vmin;z-index:0;pointer-events:none;background:radial-gradient(circle,rgba(0,232,104,0.10) 0%,rgba(0,232,104,0.03) 30%,transparent 55%);filter:blur(50px)}
        #bgCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
        .scan-line{position:fixed;top:0;left:0;bottom:0;width:3px;z-index:1;animation:scanRTL 8s linear infinite;pointer-events:none}
        .scan-line::before{content:'';position:absolute;top:0;left:-40px;bottom:0;width:80px;background:linear-gradient(90deg,transparent,rgba(0,232,104,0.06),transparent)}
        .scan-line::after{content:'';position:absolute;top:0;left:0;bottom:0;width:3px;background:linear-gradient(180deg,transparent 10%,rgba(0,232,104,0.4) 50%,transparent 90%);box-shadow:0 0 15px rgba(0,232,104,0.3)}
        @keyframes scanRTL{0%{left:100%}100%{left:-80px}}

        /* ── Login container ── */
        .login-container{position:relative;z-index:10;width:420px;max-width:90vw}

        /* ── Staggered fade-in ── */
        .fade-up{opacity:0;transform:translateY(30px);animation:fadeUp 0.7s cubic-bezier(0.16,1,0.3,1) forwards}
        .fade-up.d1{animation-delay:0.1s} .fade-up.d2{animation-delay:0.25s}
        .fade-up.d3{animation-delay:0.4s} .fade-up.d4{animation-delay:0.55s}
        @keyframes fadeUp{to{opacity:1;transform:translateY(0)}}

        /* ── Logo with glow ── */
        .logo-wrap{position:relative;width:140px;height:140px;margin:0 auto 28px}
        .logo-glow{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(0,232,104,0.18) 0%,rgba(0,232,104,0.05) 40%,transparent 70%);animation:logoGlow 4s ease-in-out infinite;pointer-events:none}
        @keyframes logoGlow{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:0.7}50%{transform:translate(-50%,-50%) scale(1.15);opacity:1}}
        .logo-img{position:relative;z-index:1;width:140px;height:140px;display:block;object-fit:contain;filter:drop-shadow(0 0 30px rgba(0,232,104,0.25));animation:logoFloat 6s ease-in-out infinite}
        @keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

        .login-title{font-family:'Orbitron',sans-serif;font-size:22px;font-weight:900;letter-spacing:6px;color:var(--accent);text-align:center;margin-bottom:4px;text-shadow:0 0 30px rgba(0,232,104,0.2)}
        .login-subtitle{font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:3px;color:var(--text3);text-align:center;margin-bottom:32px}

        /* ── Card ── */
        .login-card{background:rgba(10,26,20,0.92);border:1px solid var(--border);border-radius:12px;padding:32px;backdrop-filter:blur(24px);box-shadow:0 4px 60px rgba(0,0,0,0.6),0 0 80px rgba(0,232,104,0.04)}
        .form-group{margin-bottom:20px}
        .form-group label{display:block;font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:3px;color:var(--text3);text-transform:uppercase;margin-bottom:8px}
        .form-group input{width:100%;padding:12px 16px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'Share Tech Mono',monospace;font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s}
        .form-group input:focus{border-color:var(--accent);box-shadow:0 0 15px rgba(0,232,104,0.1)}
        .btn-login{width:100%;padding:14px;background:linear-gradient(135deg,var(--accent-dim),var(--accent));border:none;border-radius:6px;color:#020804;font-family:'Orbitron',sans-serif;font-size:13px;font-weight:700;letter-spacing:4px;cursor:pointer;text-transform:uppercase;transition:transform .3s,box-shadow .3s,background .3s}
        .btn-login:hover{transform:translateY(-2px);box-shadow:0 0 24px rgba(0,232,104,0.4),0 0 48px rgba(0,232,104,0.15),0 8px 30px rgba(0,232,104,0.25);background:linear-gradient(135deg,var(--accent),var(--accent-bright))}
        .errors{background:rgba(232,48,48,0.08);border:1px solid rgba(232,48,48,0.25);border-radius:6px;padding:12px;margin-bottom:20px;font-family:'Share Tech Mono',monospace;font-size:12px;color:#e83030}
        .login-back{display:block;text-align:center;margin-top:20px;font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:2px;color:var(--text3);text-decoration:none;text-transform:uppercase;transition:color .3s}
        .login-back:hover{color:var(--accent)}
    </style>
</head>
<body>
    <div class="grid-bg"></div>
    <div class="eye-glow-shadow"></div>

    <svg class="globe-eye" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <filter id="loginEyeGlow" x="-100%" y="-100%" width="300%" height="300%">
                <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="b1"/>
                <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b2"/>
                <feMerge><feMergeNode in="b1"/><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
            <radialGradient id="loginPupilFill" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#00e868" stop-opacity="0.5"/>
                <stop offset="60%" stop-color="#00e868" stop-opacity="0.18"/>
                <stop offset="100%" stop-color="#00e868" stop-opacity="0"/>
            </radialGradient>
        </defs>
        <g class="eye-static">
            <ellipse cx="400" cy="400" rx="390" ry="240" fill="none" stroke="#00e868" stroke-width="3.5"/>
            <ellipse cx="400" cy="400" rx="360" ry="210" fill="none" stroke="#00e868" stroke-width="1.2" opacity="0.5"/>
            <circle cx="400" cy="400" r="160" fill="none" stroke="#00e868" stroke-width="2.5"/>
            <circle cx="400" cy="400" r="60" fill="none" stroke="#00e868" stroke-width="3"/>
            <circle cx="400" cy="400" r="40" fill="url(#loginPupilFill)" filter="url(#loginEyeGlow)"/>
            <circle cx="400" cy="400" r="20" fill="#00e868" opacity="0.18" filter="url(#loginEyeGlow)"/>
            <circle cx="400" cy="400" r="8" fill="#00e868" opacity="0.4"/>
            <path d="M 10,400 Q 200,100 400,160 Q 600,100 790,400" fill="none" stroke="#00e868" stroke-width="2" opacity="0.6"/>
            <path d="M 10,400 Q 200,700 400,640 Q 600,700 790,400" fill="none" stroke="#00e868" stroke-width="2" opacity="0.6"/>
        </g>
        <g class="globe-spin">
            <ellipse cx="400" cy="400" rx="50" ry="140" fill="none" stroke="#00e868" stroke-width="1" opacity="0.4"/>
            <ellipse cx="400" cy="400" rx="100" ry="140" fill="none" stroke="#00e868" stroke-width="0.8" opacity="0.3"/>
            <ellipse cx="400" cy="400" rx="140" ry="50" fill="none" stroke="#00e868" stroke-width="0.8" opacity="0.3"/>
            <line x1="260" y1="340" x2="540" y2="340" stroke="#00e868" stroke-width="0.8" opacity="0.25"/>
            <line x1="260" y1="400" x2="540" y2="400" stroke="#00e868" stroke-width="1" opacity="0.3"/>
            <line x1="260" y1="460" x2="540" y2="460" stroke="#00e868" stroke-width="0.8" opacity="0.25"/>
            <ellipse cx="400" cy="400" rx="30" ry="140" fill="none" stroke="#00e868" stroke-width="0.8" opacity="0.25" transform="rotate(25 400 400)"/>
            <ellipse cx="400" cy="400" rx="120" ry="140" fill="none" stroke="#00e868" stroke-width="0.6" opacity="0.2" transform="rotate(-20 400 400)"/>
        </g>
    </svg>

    <canvas id="bgCanvas"></canvas>
    <div class="scan-line"></div>

    <div class="login-container">
        <div class="logo-wrap fade-up d1">
            <div class="logo-glow"></div>
            <img class="logo-img" src="{% static 'logo/logo_SV.png' %}" alt="Sauron Vision">
        </div>
        <h1 class="login-title fade-up d2">SAURON VISION</h1>
        <p class="login-subtitle fade-up d2">AUTHENTICATE TO PROCEED</p>
        <div class="login-card fade-up d3">
            {% if form.errors %}<div class="errors">AUTHENTICATION FAILED — INVALID CREDENTIALS</div>{% endif %}
            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}
                <div class="form-group"><label for="id_username">Operator ID</label><input type="text" name="username" id="id_username" autofocus autocomplete="username" required></div>
                <div class="form-group"><label for="id_password">Access Key</label><input type="password" name="password" id="id_password" autocomplete="current-password" required></div>
                <input type="hidden" name="next" value="{{ next }}">
                <button type="submit" class="btn-login">Initialize Session</button>
            </form>
        </div>
        <a href="{% url 'the_wall' %}" class="login-back fade-up d4">&larr; Back to The Wall</a>
    </div>

    <script>
    (function(){
        var canvas = document.getElementById('bgCanvas');
        var ctx = canvas.getContext('2d');
        var W, H;
        function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
        resize(); window.addEventListener('resize', resize);

        /* Symbols + drifting prices ("hashes" — labeled particles) */
        var symbols = ['EURUSD','BTCUSD','XAUUSD','SPX','AAPL','TSLA','NVDA','DAX','USDJPY','ETHUSD','GBPUSD','VIX','DXY','NDX'];
        var prices = {};
        symbols.forEach(function(s){
            prices[s] = { val: (Math.random()*5000+10).toFixed(2), chg: ((Math.random()-0.45)*4).toFixed(2) };
        });
        setInterval(function(){
            symbols.forEach(function(s){
                var v = parseFloat(prices[s].val);
                v += (Math.random()-0.48)*v*0.001;
                prices[s].val = v.toFixed(2);
                prices[s].chg = ((Math.random()-0.45)*4).toFixed(2);
            });
        }, 2000);

        /* Mix of labeled + empty particles */
        var particles = [];
        for (var i = 0; i < 60; i++) {
            particles.push({
                x: Math.random()*2000, y: Math.random()*2000,
                vx: (Math.random()-0.5)*0.35, vy: (Math.random()-0.5)*0.35,
                s: Math.random()*1.6+0.3, a: Math.random()*0.22+0.05,
                sym: i < symbols.length ? symbols[i] : null,
                trail: [], trailMax: 7
            });
        }

        function draw(){
            ctx.clearRect(0,0,W,H);
            /* Connections */
            for(var i=0;i<particles.length;i++){
                for(var j=i+1;j<particles.length;j++){
                    var dx=particles[i].x-particles[j].x,dy=particles[i].y-particles[j].y;
                    var d=Math.sqrt(dx*dx+dy*dy);
                    if(d<130){
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x,particles[i].y);
                        ctx.lineTo(particles[j].x,particles[j].y);
                        ctx.strokeStyle='rgba(0,232,104,'+(0.04*(1-d/130))+')';
                        ctx.stroke();
                    }
                }
            }
            /* Particles + trails + labels */
            for(var k=0;k<particles.length;k++){
                var p=particles[k];

                /* Push current pos to trail */
                p.trail.push({x:p.x, y:p.y});
                if(p.trail.length > p.trailMax) p.trail.shift();

                p.x+=p.vx; p.y+=p.vy;
                if(p.x<0||p.x>W){ p.vx*=-1; p.trail=[]; }
                if(p.y<0||p.y>H){ p.vy*=-1; p.trail=[]; }

                /* Fading trail */
                for(var ti=0; ti<p.trail.length; ti++){
                    var frac=(ti+1)/p.trail.length;
                    var tailA=p.a*frac*0.55;
                    var tailR=p.s*frac*0.75;
                    if(tailR<0.2) continue;
                    ctx.beginPath();
                    ctx.arc(p.trail[ti].x,p.trail[ti].y,tailR,0,Math.PI*2);
                    ctx.fillStyle='rgba(0,232,104,'+tailA.toFixed(3)+')';
                    ctx.fill();
                }

                /* Core particle */
                ctx.beginPath();
                ctx.arc(p.x,p.y,p.s,0,Math.PI*2);
                ctx.fillStyle='rgba(0,232,104,'+p.a+')';
                ctx.fill();

                /* Ticker label */
                if(p.sym && prices[p.sym]){
                    var pr = prices[p.sym];
                    ctx.font='10px "Share Tech Mono", monospace';
                    ctx.fillStyle='rgba(0,232,104,0.28)';
                    ctx.fillText(p.sym, p.x+10, p.y-5);
                    ctx.fillStyle = parseFloat(pr.chg) >= 0 ? 'rgba(0,232,104,0.18)' : 'rgba(232,48,48,0.18)';
                    ctx.fillText(pr.val, p.x+10, p.y+8);
                }
            }
            requestAnimationFrame(draw);
        }
        draw();

        /* Mouse parallax: eye + glow shadow at different depths */
        var globe = document.querySelector('.globe-eye');
        var eyeShadow = document.querySelector('.eye-glow-shadow');
        document.addEventListener('mousemove', function(e){
            var mx = (e.clientX/W - 0.5)*2, my = (e.clientY/H - 0.5)*2;
            if(globe) globe.style.transform = 'translate(calc(-50% + '+mx*15+'px), calc(-50% + '+my*15+'px))';
            if(eyeShadow) eyeShadow.style.transform = 'translate(calc(-50% + '+mx*32+'px), calc(-50% + '+my*32+'px))';
        });
    })();
    </script>
</body>
</html>
