{% comment %}
Chart.js loader. Include with: {% include "_chart_assets.html" %}
Use once per page; later includes detect the loaded flag and skip.
{% endcomment %}
{% if not request.chart_assets_loaded %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"
        integrity="sha384-rHwkN4ZQrQezJlqaepbhhyNvk9PqaH7GqvO5Hjfrxol0w63cKx2OqAVCXjuVUFLJ"
        crossorigin="anonymous"></script>
<script>
  // Common dark theme defaults that match Sauron's --accent / --text vars
  if (typeof Chart !== "undefined") {
    Chart.defaults.color = "#5a8a6a";
    Chart.defaults.borderColor = "#133020";
    Chart.defaults.font.family = "'Share Tech Mono', monospace";
    Chart.defaults.font.size = 11;
  }
  window.SAURON_CHART_COLORS = {
    accent: "#00e868",
    accentDim: "rgba(0, 232, 104, 0.18)",
    red: "#e83030",
    redDim: "rgba(232, 48, 48, 0.18)",
    gold: "#d8b020",
    blue: "#30a0e8",
    purple: "#8840d0",
    text: "#c8e8d8",
    border: "#133020",
  };
</script>
<style>
  .sv-chart-container { position: relative; height: 280px; margin: 16px 0; }
  .sv-chart-container.tall { height: 380px; }
  .sv-chart-container.short { height: 180px; }
  .sv-metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
                     gap: 14px; margin: 16px 0; }
  .sv-metric-card {
    background: linear-gradient(160deg, var(--bg-card) 0%, rgba(8,20,16,0.92) 60%, rgba(6,14,10,0.88) 100%);
    border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 16px 18px; position: relative; overflow: hidden;
    transition: all 0.35s cubic-bezier(.2,.8,.2,1);
    box-shadow: 0 2px 16px rgba(0,0,0,0.35), inset 0 1px 0 rgba(0,232,104,0.03);
  }
  .sv-metric-card::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent 5%, rgba(0,232,104,0.2) 50%, transparent 95%);
    opacity: 0; transition: opacity 0.4s;
  }
  .sv-metric-card::after {
    content: ""; position: absolute; bottom: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent 10%, var(--accent-dim) 50%, transparent 90%);
    opacity: 0; transition: opacity 0.4s;
  }
  .sv-metric-card:hover {
    border-color: var(--border-glow); transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.45), 0 0 1px rgba(0,232,104,0.15),
                inset 0 1px 0 rgba(0,232,104,0.06);
  }
  .sv-metric-card:hover::before, .sv-metric-card:hover::after { opacity: 1; }
  body.light-mode .sv-metric-card { box-shadow: none; background: var(--bg-card); }
  body.light-mode .sv-metric-card:hover { box-shadow: none; }
  .sv-metric-label { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted);
                     text-transform: uppercase; letter-spacing: 2px; }
  .sv-metric-value { font-family: var(--font-display); font-size: 22px; font-weight: 700;
                     color: var(--text-primary); margin-top: 4px;
                     font-variant-numeric: tabular-nums; }
  .sv-metric-value.up { color: var(--accent); }
  .sv-metric-value.down { color: var(--accent-red); }
  .sv-section-title { font-family: var(--font-mono); font-size: 10px;
                      color: var(--text-muted); text-transform: uppercase;
                      letter-spacing: 3px; margin: 24px 0 12px; padding-bottom: 6px;
                      border-bottom: 1px solid var(--border); }
</style>
{% endif %}
