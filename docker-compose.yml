# Local development only. Production lives in deploy/docker-compose.yml —
# see deploy/RUNBOOK.md. This file exists so you can run the full stack
# (Postgres + Redis + Django) on your machine without installing either
# service natively; it bind-mounts the source and runs the dev server.

name: sauron-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sauron_vision
      POSTGRES_USER: sauron
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword}
    ports:
      - "5432:5432"
    volumes:
      - devpgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sauron -d sauron_vision"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  devpgdata:
