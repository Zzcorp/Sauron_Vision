# Production docker-compose (Phase 30).
# Differences from docker-compose.yml (dev):
#   - Uses Dockerfile.prod (multi-stage, non-root, gunicorn+uvicorn)
#   - No source bind-mount; the image is the source of truth
#   - Restart: unless-stopped on every long-running service
#   - Postgres + Redis no longer publish ports to the host
#   - Per-service log size caps so a runaway worker doesn't fill the disk
#   - Sensible resource hints (mem_limit) for single-host deployments
#
# Bootstrap:
#   cp .env.example .env       # fill in secrets
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml exec web python manage.py createsuperuser
#
# Migrations + collectstatic run automatically on `web` container start.

x-app: &app-base
  image: sauron-vision:prod
  build:
    context: .
    dockerfile: Dockerfile.prod
  restart: unless-stopped
  env_file:
    - .env
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sauron_vision}
      POSTGRES_USER: ${DB_USER:-sauron}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sauron} -d ${DB_NAME:-sauron_vision}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    <<: *app-base
    # entrypoint runs migrations + collectstatic, then handoff to CMD
    entrypoint: ["/app/scripts/entrypoint.sh"]
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
      - logs:/app/logs

  celery-worker-fast:
    <<: *app-base
    command: ["celery", "-A", "config", "worker", "-l", "info",
              "-Q", "fast,default", "-c", "${CELERY_FAST_CONCURRENCY:-4}",
              "--hostname=fast@%h"]
    volumes:
      - logs:/app/logs

  celery-worker-slow:
    <<: *app-base
    command: ["celery", "-A", "config", "worker", "-l", "info",
              "-Q", "slow,ai", "-c", "${CELERY_SLOW_CONCURRENCY:-2}",
              "--hostname=slow@%h"]
    volumes:
      - logs:/app/logs

  celery-beat:
    <<: *app-base
    command: ["celery", "-A", "config", "beat", "-l", "info",
              "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    volumes:
      - logs:/app/logs

volumes:
  pgdata:
  redisdata:
  staticfiles:
  media:
  logs:
