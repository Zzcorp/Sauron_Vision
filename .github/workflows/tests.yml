name: tests

# The repository is private (2026-11-05), so every Actions minute counts
# against the monthly quota. The suite runs on each pull request, and only
# there: the merge to main is not tested again (its pull request already
# ran it). A run can still be started by hand from the Actions tab
# (workflow_dispatch), on any branch.
on:
  pull_request:
  workflow_dispatch:

jobs:
  django-tests:
    runs-on: ubuntu-latest
    # The serial run took about 56 of 60 minutes on the public 4-vCPU
    # runner; a private repository's runner has 2 vCPUs. The parallel run
    # below is the time saved; this is the margin.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt

      # requirements-ci.txt is what the test runner alone needs (tblib, for
      # the parallel workers' tracebacks); no image installs it.
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-ci.txt

      # The eToro feed's store runs a Lua compare-and-set in Redis; its tests
      # (tests/feed/test_venue_store_rules.py) start their own redis-server
      # on a private unix socket and FAIL here without the binary, so the
      # script can never drift from its in-memory twin unseen. The package
      # starts a server on port 6379: it is stopped at once, because
      # settings.py would otherwise find it and move the whole suite off
      # the locmem cache it is written for.
      - name: Install redis-server (binary only, service stopped)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq redis-server
          sudo systemctl stop redis-server || true
          sudo systemctl disable redis-server || true
          if (exec 3<>/dev/tcp/127.0.0.1/6379) 2>/dev/null; then
            echo "a Redis still listens on 6379" >&2; exit 1
          fi
          redis-server --version

      # WhiteNoise serves from STATIC_ROOT; a test asserts every template
      # asset was actually collected, so CI must collect like a deploy does.
      - name: Collect static assets
        env:
          DB_ENGINE: sqlite
        run: python manage.py collectstatic --noinput

      # No Postgres/Redis services on purpose: settings.py degrades to
      # SQLite + locmem cache + in-memory channels, which is exactly the
      # environment the suite is written for. --parallel auto runs one
      # worker per vCPU, each on its own copy of the test database.
      - name: Run test suite
        env:
          DB_ENGINE: sqlite
        run: python manage.py test tests --parallel auto --verbosity=1
